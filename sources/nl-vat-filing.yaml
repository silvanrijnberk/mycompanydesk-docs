# NL btw-aangifte: tijdvakken en uiterste data aangifte en betaling.
# Curated by hand. The mcd-public-surfaces-sync agent reads but never writes.

last_verified: 2026-10-13
verified_by: silvanrijnberk
source_url: https://www.belastingdienst.nl/wps/wcm/connect/nl/btw/content/uiterste-aangifte-en-betaaldatums
notes: |
  Geldt voor in Nederland gevestigde ondernemers. Buitenlandse ondernemers
  hebben andere termijnen (2 maanden na tijdvak), niet hier gemodelleerd.
  Aangifte- en betaaldatum is de ONTVANGSTdatum (aangifte ontvangen, bedrag
  bijgeschreven), niet de verzenddatum. Geen weekend/feestdagregel gevonden
  op de geraadpleegde pagina's. Software-aangifte kan pas vanaf de 24e van
  de laatste maand van het tijdvak.

periods:
  default: quarter     # "Meestal doet u aangifte per kwartaal."
  allowed: [month, quarter, year]

deadlines:
  month_or_quarter:
    rule: laatste dag van de maand die volgt op het tijdvak (aangifte en betaling)
    filing_quote: "Dan doet u dat uiterlijk op de laatste dag van de maand die volgt op het kwartaal of de maand waarover u aangifte doet."
    filing_source: https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/btw/btw_aangifte_doen_en_betalen/btw-aangifte-waar-moet-u-aan-denken/btw-aangifte-waar-moet-u-aan-denken
    payment_quote: "U moet ervoor zorgen dat wij het btw-bedrag ontvangen binnen een maand na afloop van het aangiftetijdvak."
    payment_source: https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/btw/btw_aangifte_doen_en_betalen/btw_betalen/op_tijd_betalen
  year:
    rule: vóór 1 april van het volgende jaar (aangifte en betaling), dus uiterlijk 31 maart
    filing_quote: "Dan doet u aangifte vóór 1 april van het eerstvolgende jaar."
    filing_source: https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/btw/btw_aangifte_doen_en_betalen/btw-aangifte-waar-moet-u-aan-denken/btw-aangifte-waar-moet-u-aan-denken
    payment_quote: "Doet u per jaar aangifte? Dan moeten wij uw betaling vóór 1 april van het volgende jaar hebben ontvangen."
    payment_source: https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/btw/btw_aangifte_doen_en_betalen/btw_betalen/op_tijd_betalen
  received_date_quote: "Als betaaldatum geldt de datum waarop uw betaling is bijgeschreven op onze rekening."

